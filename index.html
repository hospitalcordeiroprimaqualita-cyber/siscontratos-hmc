                          {confirmando ? (
                            <div style={{display:'flex',gap:6,alignItems:'center',justifyContent:'flex-end'}}>
                              <span style={{fontSize:11,color:'#b91c1c',fontWeight:600}}>Excluir?</span>
                              <button className="btn btn-danger btn-sm" disabled={saving} onClick={()=>excluirMedicao(e)}>Sim</button>
                              <button className="btn btn-secondary btn-sm" disabled={saving} onClick={()=>setConfirmarExclusaoChave(null)}>Não</button>
                            </div>
                          ) : (
                            <div style={{display:'flex',gap:4,justifyContent:'flex-end'}}>
                              <ActBtn icon={aberto?'fa-chevron-up':'fa-chevron-down'} onClick={()=>setMesExpandido(aberto?null:chave)} title="Ver detalhe" />
                              <ActBtn icon="fa-file-invoice-dollar" onClick={()=>gerarRelatorioCienciaFinanceira(e)} title="Gerar Relatório de Ciência Financeira (fiscal → financeiro da Prima Qualitá)" />
                              <ActBtn icon="fa-pen" onClick={()=>{ setMedicaoContrato(e.contrato_id); setMedicaoMes(e.mes_referencia); setSection('medicao'); }} title="Corrigir esta medição" />
                              <ActBtn icon="fa-trash" danger onClick={()=>setConfirmarExclusaoChave(chave)} title="Apagar esta medição" />
                            </div>
                          )}
                        </td>
                      </tr>
                      {aberto && (
                        <tr><td colSpan={5} style={{padding:0,background:'#FAFBFD'}}>
                          <div style={{padding:'10px 16px'}}>{detalheDoMes(e)}</div>
                        </td></tr>
                      )}
                    </React.Fragment>
                  );
                })}</tbody>
              </table>
              <div style={{padding:'8px 16px',fontSize:11.5,color:'var(--text3)'}}>
                <i className="fa-solid fa-circle-info"/> <strong>Relatório de Ciência Financeira</strong> gera um documento pra dar ciência ao financeiro da Prima Qualitá sobre a execução e o acompanhamento do contrato naquele mês. <strong>Corrigir</strong> abre a medição no mês certo com os valores já lançados, prontos pra ajustar e registrar de novo. <strong>Apagar</strong> remove o registro e os lançamentos daquele mês e recalcula automaticamente o saldo acumulado do item e do contrato.
              </div>
            </div>
          )}
        </div>
      </>
    );
  };


  // ─── CONSUMO POR RUBRICA ─────────────────────────────────────────────────
  const renderRubrica = () => {
    const itensComRubrica = itens.filter(it => it.rubrica);
    const rubricas = [...new Set(itensComRubrica.map(it => it.rubrica))];
    const contratosSemRubrica = contratos.filter(c => itens.some(it => it.contrato_id === c.id) && !itens.some(it => it.contrato_id === c.id && it.rubrica));

    const anoRef = rubricaMes.slice(0,4);
    const dadosRubrica = rubricas.map(rub => {
      const info = rubricaInfo(rub);
      const itensRub = itensComRubrica.filter(it => it.rubrica === rub);
      const contratado = itensRub.reduce((acc,it) => acc + (it.vlr_unitario||0)*(it.qtd_mensal||0), 0);
      // Executado no mês selecionado: contratos genéricos usam medicoesItensHist; médicos usam lancamentos.
      const executado = itensRub.reduce((acc, it) => {
        const histGenerico = medicoesItensHist.filter(mi => mi.item_id === it.id && mi.mes_referencia === rubricaMes)
          .reduce((a,mi) => a + (mi.qtd_executada||0)*(mi.vlr_unitario||it.vlr_unitario||0), 0);
        const histMedico = lancamentos.filter(l => l.item_id === it.id && l.mes_referencia === rubricaMes)
          .reduce((a,l) => a + (l.quantidade||0)*(l.valor_unitario||it.vlr_unitario||0), 0);
        return acc + histGenerico + histMedico;
      }, 0);
      const tetoMensal = info?.mensal || 0;
      const pctTeto = tetoMensal>0 ? Math.round((executado/tetoMensal)*100) : 0;
      const pctContratado = contratado>0 ? Math.round((executado/contratado)*100) : 0;

      // ── Projeção anual: pega todo mês do ano de rubricaMes com execução real
      // registrada (qualquer contrato desta rubrica) e projeta pelos 12 meses.
      const porMesAno = {};
      itensRub.forEach(it => {
        medicoesItensHist.filter(mi => mi.item_id === it.id && mi.mes_referencia.startsWith(anoRef)).forEach(mi => {
          porMesAno[mi.mes_referencia] = (porMesAno[mi.mes_referencia]||0) + (mi.qtd_executada||0)*(mi.vlr_unitario||it.vlr_unitario||0);
        });
        lancamentos.filter(l => l.item_id === it.id && l.mes_referencia.startsWith(anoRef)).forEach(l => {
          porMesAno[l.mes_referencia] = (porMesAno[l.mes_referencia]||0) + (l.quantidade||0)*(l.valor_unitario||it.vlr_unitario||0);
        });
      });
      const mesesComDado = Object.keys(porMesAno).filter(m => porMesAno[m] > 0);
      const executadoAno = Object.values(porMesAno).reduce((a,b)=>a+b, 0);
      const mediaMensalReal = mesesComDado.length ? executadoAno / mesesComDado.length : 0;
      const projecaoAnual = mediaMensalReal * 12;
      const tetoAnual = info?.anual || 0;
      const pctAnual = tetoAnual>0 ? Math.round((projecaoAnual/tetoAnual)*100) : 0;

      // Contribuição por contrato dentro desta rubrica
      const contratosIds = [...new Set(itensRub.map(it => it.contrato_id))];
      const porContrato = contratosIds.map(cid => {
        const c = contratos.find(x => x.id === cid);
        const itensDoContratoNaRubrica = itensRub.filter(it => it.contrato_id === cid);
        const execContrato = itensDoContratoNaRubrica.reduce((acc, it) => {
          const hg = medicoesItensHist.filter(mi => mi.item_id === it.id && mi.mes_referencia === rubricaMes).reduce((a,mi)=>a+(mi.qtd_executada||0)*(mi.vlr_unitario||it.vlr_unitario||0),0);
          const hm = lancamentos.filter(l => l.item_id === it.id && l.mes_referencia === rubricaMes).reduce((a,l)=>a+(l.quantidade||0)*(l.valor_unitario||it.vlr_unitario||0),0);
          return acc + hg + hm;
        }, 0);
        return { contrato:c, valor:execContrato };
      }).sort((a,b) => b.valor - a.valor);
      return { rubrica:rub, desc:info?.desc||'', tetoMensal, contratado, executado, pctTeto, pctContratado, porContrato,
                mesesComDado:mesesComDado.length, executadoAno, mediaMensalReal, projecaoAnual, tetoAnual, pctAnual };
    }).sort((a,b) => b.pctAnual - a.pctAnual);

    return (
      <>
        <div className="panel">
          <div className="panel-body">
            <div className="form-group" style={{maxWidth:220}}>
              <label>Mês de referência</label>
              <input type="month" value={rubricaMes} onChange={e=>setRubricaMes(e.target.value)} />
            </div>
          </div>
        </div>

        {rubricas.length === 0 ? (
          <div className="panel"><div className="panel-body">
            <div className="empty"><i className="fa-solid fa-scale-balanced"/>Nenhum item tem rubrica cadastrada ainda.<br/><span style={{fontSize:12,marginTop:6,display:'block'}}>Edite os itens em <strong>Controle de quantidade</strong> e escolha a rubrica orçamentária.</span></div>
          </div></div>
        ) : (
          <>
            <div className="panel">
              <div className="panel-head"><h2><i className="fa-solid fa-chart-bar"/> % do teto anual projetado — com base na média real até {mesToPT(rubricaMes)}</h2></div>
              <div className="panel-body">
                <HorizontalBarChart labels={dadosRubrica.map(d=>`${d.rubrica}`)} data={dadosRubrica.map(d=>d.pctAnual)} color="#178DBB" height={Math.max(180,dadosRubrica.length*36)} />
              </div>
            </div>

            <div className="panel">
              <div className="panel-head">
                <h2><i className="fa-solid fa-list"/> Resumo por rubrica ({dadosRubrica.length})</h2>
                <span style={{fontSize:11.5,color:'var(--text3)'}}>Clique numa linha pra ver o detalhe por contrato</span>
              </div>
              <div className="tbl-wrap">
                <table>
                  <thead><tr>
                    <th>Rubrica</th><th>Teto mensal</th><th>Executado no mês</th><th>% mês</th>
                    <th>Média real/mês</th><th>Projeção anual</th><th>Teto anual</th><th>% anual projetado</th><th></th>
                  </tr></thead>
                  <tbody>{dadosRubrica.map(d => {
                    const clsAnual = d.pctAnual>=100?'vermelho':d.pctAnual>=85?'laranja':d.pctAnual>=70?'amarelo':'verde';
                    const aberto = rubricaExpandida === d.rubrica;
                    return (
                      <React.Fragment key={d.rubrica}>
                        <tr style={{cursor:'pointer'}} onClick={()=>setRubricaExpandida(aberto?null:d.rubrica)}>
                          <td><strong className="mono">{d.rubrica}</strong><div style={{fontSize:11,color:'var(--text3)',maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.desc}</div></td>
                          <td>{brl(d.tetoMensal)}</td>
                          <td style={{fontWeight:600,color:d.executado>d.tetoMensal?'#b91c1c':'var(--text)'}}>{brl(d.executado)}</td>
                          <td style={{minWidth:90}}><ProgBar p={Math.min(d.pctTeto,100)}/></td>
                          <td>{brl(d.mediaMensalReal)}<div style={{fontSize:10.5,color:'var(--text3)'}}>{d.mesesComDado} {d.mesesComDado===1?'mês':'meses'} com dado em {anoRef}</div></td>
                          <td style={{fontWeight:600}}>{brl(d.projecaoAnual)}</td>
                          <td>{brl(d.tetoAnual)}</td>
                          <td style={{minWidth:110}}><Badge cls={clsAnual} label={`${d.pctAnual}%`} /></td>
                          <td><ActBtn icon={aberto?'fa-chevron-up':'fa-chevron-down'} onClick={(e)=>{e.stopPropagation(); setRubricaExpandida(aberto?null:d.rubrica);}} title="Ver detalhe por contrato" /></td>
                        </tr>
                        {aberto && (
                          <tr><td colSpan={9} style={{padding:0,background:'#FAFBFD'}}>
                            <div style={{padding:'14px 16px'}}>
                              <div style={{display:'flex',gap:20,marginBottom:12,flexWrap:'wrap'}}>
                                <div><div className="s-label">Diferença p/ o teto mensal</div><div style={{fontWeight:700,fontSize:15,color:d.executado>d.tetoMensal?'#b91c1c':'#16a34a'}}>{d.executado>d.tetoMensal?'+':''}{brl(d.executado-d.tetoMensal)}</div></div>
                                <div><div className="s-label">Executado acumulado em {anoRef}</div><div style={{fontWeight:700,fontSize:15}}>{brl(d.executadoAno)}</div></div>
                                <div><div className="s-label">Diferença p/ o teto anual (projetado)</div><div style={{fontWeight:700,fontSize:15,color:d.projecaoAnual>d.tetoAnual?'#b91c1c':'#16a34a'}}>{d.projecaoAnual>d.tetoAnual?'+':''}{brl(d.projecaoAnual-d.tetoAnual)}</div></div>
                                <div><div className="s-label">Contratado (soma dos itens)</div><div style={{fontWeight:700,fontSize:15}}>{brl(d.contratado)}</div></div>
                              </div>
                              <div className="tbl-wrap">
                                <table>
                                  <thead><tr><th>Contrato</th><th>Empresa</th><th>Executado no mês</th><th>% do teto da rubrica</th></tr></thead>
                                  <tbody>{d.porContrato.map(pc => (
                                    <tr key={pc.contrato?.id}>
                                      <td className="mono"><strong>{pc.contrato?.numero}</strong></td>
                                      <td style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{pc.contrato?.empresa}</td>
                                      <td style={{fontWeight:600}}>{brl(pc.valor)}</td>
                                      <td style={{minWidth:100}}><ProgBar p={d.tetoMensal>0?Math.min(Math.round((pc.valor/d.tetoMensal)*100),100):0} /></td>
                                    </tr>
                                  ))}</tbody>
                                </table>
                              </div>
                            </div>
                          </td></tr>
                        )}
                      </React.Fragment>
                    );
                  })}</tbody>
                </table>
              </div>
              <div style={{padding:'8px 16px',fontSize:11.5,color:'var(--text3)'}}>
                <i className="fa-solid fa-circle-info"/> <strong>Projeção anual</strong> = média real de execução por mês (considerando só os meses de {anoRef} com dado lançado) × 12. Ordenado pelo maior % do teto anual projetado primeiro.
              </div>
            </div>
          </>
        )}

        {contratosSemRubrica.length > 0 && (
          <div className="panel"><div className="panel-body" style={{fontSize:11.5,color:'var(--text2)'}}>
            <i className="fa-solid fa-circle-info"/> {contratosSemRubrica.length} contrato(s) ainda sem rubrica cadastrada nos itens: {contratosSemRubrica.map(c=>c.numero).join(', ')}
          </div></div>
        )}
      </>
    );
  };


  // ─── RELATÓRIO MENSAL ────────────────────────────────────────────────────
  const [relatorioMes, setRelatorioMes] = React.useState(todayMonth());
  const [pedidoContrato, setPedidoContrato] = React.useState('');
  const [pedidoQtds, setPedidoQtds] = React.useState({}); // { [item_id]: quantidade a pedir }
  const [pedidoBase, setPedidoBase] = React.useState('media'); // 'media' | 'contratado'

  useEffect(() => {
    if (!pedidoContrato) { setPedidoQtds({}); return; }
    const c = contratos.find(x => x.id === pedidoContrato);
    const itensDoContrato = itens.filter(i => i.contrato_id === pedidoContrato);
    const novasQtds = {};
    itensDoContrato.forEach(it => {
      if (pedidoBase === 'contratado') {
        novasQtds[it.id] = it.qtd_mensal || 0;
      } else {
        // Média histórica real. Se o item nunca foi usado ainda (sem histórico),
        // não faz sentido sugerir o valor contratado inteiro — deixa em branco
        // pra quem está pedindo preencher com o que realmente precisa.
        if (c?.inicio && (it.qtd_acum||0) > 0) {
          const mesesDec = Math.max(1, mesesCalendario(c.inicio, new Date().toISOString()));
          novasQtds[it.id] = Math.round((it.qtd_acum||0) / mesesDec);
        } else {
          novasQtds[it.id] = '';
        }
      }
    });
    setPedidoQtds(novasQtds);
  }, [pedidoContrato, pedidoBase, itens, contratos]);

  const gerarRelatorioMensal = () => {
    const mesRef = mesToPT(relatorioMes);
    const [ry, rm] = relatorioMes.split('-').map(Number);
    const mesCurto = (mes) => { const [y,m] = mes.split('-'); const nomes=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return nomes[parseInt(m)]+'/'+y.slice(2); };

    // Status das medições (mesma lógica do Painel)
    const statusMedicoesRel = contratos.filter(c => c.status !== 'finalizado').map(c => {
      const execsContrato = execucoes.filter(e => e.contrato_id === c.id && e.mes_referencia <= relatorioMes);
      const ultimoMes = execsContrato.length ? execsContrato.map(e=>e.mes_referencia).sort().slice(-1)[0] : null;
      let cls='vermelho', label='Nunca medido', mesesAtraso=null;
      if (ultimoMes) {
        const [uy,um] = ultimoMes.split('-').map(Number);
        mesesAtraso = (ry - uy)*12 + (rm - um);
        if (mesesAtraso<=1) { cls='verde'; label='Em dia'; }
        else if (mesesAtraso===2) { cls='amarelo'; label='Atenção · 1 mês atrasado'; }
        else { cls='vermelho'; label=`Atrasada · ${mesesAtraso-1}m`; }
      }
      return { c, ultimoMes, cls, label };
    });
    const emDiaCount = statusMedicoesRel.filter(s=>s.cls==='verde').length;
    const atencaoCount = statusMedicoesRel.filter(s=>s.cls==='amarelo').length;
    const atrasadoCount = statusMedicoesRel.filter(s=>s.cls==='vermelho').length;
    const statusAtencao = statusMedicoesRel.filter(s=>s.cls!=='verde').sort((a,b)=> a.cls===b.cls?0:(a.cls==='vermelho'?-1:1));

    // Contratos vencendo em breve
    const vencendo = contratos.filter(c => { const d = dias(c.fim); return d<=90; }).sort((a,b)=>dias(a.fim)-dias(b.fim));

    // Aditivo/supressão: tratado à parte na aba "Aditivos e Supressões" (que já
    // filtra só o risco real). Aqui no relatório não repetimos essa análise.

    // Aditivo/supressão — indicativo condensado por contrato (mesma lógica da aba
    // Aditivos e Supressões), pra apoiar a decisão do gestor sem virar tabela extensa.
    const analiseReequilibrioRel = contratos.map(c => {
      const itensC = itens.filter(i => i.contrato_id === c.id);
      const deficit = [], superavit = [];
      itensC.forEach(it => {
        const a = calcAnaliseItem(c, it);
        if (!a) return;
        const valor = Math.abs(a.dif) * (it.vlr_unitario || 0);
        if (a.acao === 'ADITIVO') deficit.push({ item: it, dif: a.dif, valor });
        else if (a.acao === 'SUPRESSÃO') superavit.push({ item: it, dif: a.dif, valor });
      });
      if (!deficit.length) return null;
      const totalFalta = deficit.reduce((acc,d)=>acc+d.valor,0);
      const alocacoes = alocarReequilibrio(deficit, superavit);
      const totalCobertoPorReequilibrio = alocacoes.reduce((acc,a)=>acc+a.valor,0);
      const podeReequilibrar = totalCobertoPorReequilibrio >= totalFalta - 0.01;
      return { contrato:c, totalFalta, podeReequilibrar, valorAditivoNecessario: Math.max(0,totalFalta-totalCobertoPorReequilibrio) };
    }).filter(Boolean);

    // Rubrica (reaproveita a mesma lógica de renderRubrica, recalculada aqui pro mês do relatório)
    const itensComRubrica = itens.filter(it => it.rubrica);
    const rubricasRel = [...new Set(itensComRubrica.map(it => it.rubrica))].map(rub => {
      const info = rubricaInfo(rub);
      const itensRub = itensComRubrica.filter(it => it.rubrica === rub);
      const executado = itensRub.reduce((acc, it) => {
        const hg = medicoesItensHist.filter(mi => mi.item_id===it.id && mi.mes_referencia===relatorioMes).reduce((a,mi)=>a+(mi.qtd_executada||0)*(mi.vlr_unitario||it.vlr_unitario||0),0);
        const hm = lancamentos.filter(l => l.item_id===it.id && l.mes_referencia===relatorioMes).reduce((a,l)=>a+(l.quantidade||0)*(l.valor_unitario||it.vlr_unitario||0),0);
        return acc+hg+hm;
      }, 0);
      const tetoMensal = info?.mensal || 0;
      return { rub, desc:info?.desc||'', tetoMensal, executado, pct: tetoMensal>0?Math.round((executado/tetoMensal)*100):0 };
    }).sort((a,b) => b.pct - a.pct);
    const rubricasCriticas = rubricasRel.filter(r=>r.pct>=70);
    const piorRubrica = rubricasRel[0];

    // Evolução do valor executado — últimos 6 meses (soma de todos os contratos)
    const mesesEvolucao = [];
    for (let i=5;i>=0;i--) { const d = new Date(ry, rm-1-i, 1); mesesEvolucao.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
    const evolucaoMensal = mesesEvolucao.map(m => ({ label: mesCurto(m), valor: execucoes.filter(e=>e.mes_referencia===m).reduce((a,e)=>a+(e.valor||0),0) }));
    const totalExecutadoMes = execucoes.filter(e=>e.mes_referencia===relatorioMes).reduce((a,e)=>a+(e.valor||0),0);

    // ── Resumo executivo (texto corrido) ────────────────────────────────
    const paragrafo1 = `No mês de referência de ${mesRef}, o ${UNIDADE_CONFIG.nomeUnidade} executou o total de ${brl(totalExecutadoMes)} em contratos de gestão sob o Contrato de Gestão nº ${UNIDADE_CONFIG.contratoGestao}, distribuídos entre ${contratos.length} contrato(s) ativo(s) acompanhados pelo sistema. Das medições esperadas para o período, ${emDiaCount} contrato(s) encontram-se em dia, ${atencaoCount} necessitam atenção por um mês de atraso e ${atrasadoCount} estão com medição em atraso superior a um mês.`;
    const paragrafo2 = rubricasCriticas.length
      ? `Em relação ao consumo orçamentário por rubrica, ${rubricasCriticas.length} rubrica(s) atingiram ou ultrapassaram 70% do teto mensal aprovado na Proposta Financeira, com destaque para "${piorRubrica.desc}" (${piorRubrica.pct}% do teto). Recomenda-se acompanhamento próximo dessas rubricas para evitar extrapolação do orçamento aprovado.`
      : `Nenhuma rubrica orçamentária atingiu 70% do teto mensal aprovado neste mês.`;
    const paragrafo3 = vencendo.length
      ? `Por fim, ${vencendo.length} contrato(s) vencem em até 90 dias e requerem atenção quanto à prorrogação, renovação ou nova licitação, conforme detalhado na Seção 2 deste relatório.`
      : `Não há contratos com vencimento previsto para os próximos 90 dias.`;

    const recomendacoes = [];
    if (atrasadoCount>0) recomendacoes.push(`Regularizar a medição dos ${atrasadoCount} contrato(s) em atraso o quanto antes, para não comprometer o controle financeiro e a análise de saldo.`);
    if (rubricasCriticas.length>0) recomendacoes.push(`Monitorar de perto as rubricas em alerta (≥70% do teto), especialmente "${piorRubrica.desc}".`);
    if (vencendo.filter(c=>dias(c.fim)<=30).length>0) recomendacoes.push(`Priorizar a prorrogação/renovação dos contratos com vencimento em até 30 dias.`);
    if (!recomendacoes.length) recomendacoes.push('Nenhuma ação crítica identificada para o período — manter o acompanhamento de rotina.');

    const logoImg = LOGO_PDF_B64 ? `<img src="data:image/png;base64,${LOGO_PDF_B64}" style="width:100%;max-width:100%;display:block;">` : '<strong>PRIMA QUALITÁ SAÚDE</strong>';
    const estilos = `<style>
      * { box-sizing: border-box; margin:0; padding:0; }
      body { font-family: Arial, sans-serif; font-size: 11px; color:#000; padding:24px; }
      .header { text-align:center; margin-bottom:14px; }
      .header h3 { font-size:11px; font-weight:normal; letter-spacing:1px; margin-top:6px; }
      .titulo-box { border:1px solid #000; padding:10px; text-align:center; margin-bottom:16px; }
      .titulo-box h2 { font-size:15px; font-weight:bold; }
      .sec-titulo { background:#0F6E56; color:#fff; padding:7px 10px; font-weight:bold; font-size:12px; margin:16px 0 6px; }
      table { width:100%; border-collapse:collapse; margin-bottom:8px; }
      th { background:#d0d0d0; border:1px solid #000; padding:5px 6px; font-size:9.5px; text-align:center; font-weight:bold; }
      td { border:1px solid #000; padding:4px 6px; font-size:9.5px; }
      td.desc{text-align:left;} td.num{text-align:center;} td.val{text-align:right;}
      .badge-pdf { display:inline-block; padding:2px 7px; border-radius:10px; font-size:9px; font-weight:bold; color:#fff; }
      .obs { font-size:10px; color:#333; margin:6px 0 14px; line-height:1.5; }
      .resumo-texto { font-size:10.5px; line-height:1.7; text-align:justify; margin-bottom:4px; }
      .kpis { display:flex; gap:10px; margin:12px 0 16px; }
      .kpi-card { flex:1; border:1px solid #ccc; border-radius:6px; padding:10px 8px; text-align:center; }
      .kpi-card .val { font-size:17px; font-weight:bold; color:#0F6E56; }
      .kpi-card .lbl { font-size:8.5px; color:#555; margin-top:3px; line-height:1.3; }
      .chart-box { border:1px solid #e0e0e0; border-radius:6px; padding:12px 10px; margin-bottom:8px; text-align:center; }
      .chart-box .titulo-chart { font-size:10px; font-weight:bold; color:#333; margin-bottom:8px; text-align:left; }
      .recos { font-size:10.5px; line-height:1.8; padding-left:18px; margin-bottom:8px; }
      .assinaturas { margin-top:50px; display:flex; gap:40px; justify-content:center; }
      .assinatura-box { flex:1; text-align:center; max-width:260px; }
      .assinatura-box .linha { border-top:1px solid #000; margin-bottom:4px; }
      @media print { body{padding:12px;} }
      .rodape-sistema { position: fixed; bottom: 0; left: 0; right: 0; padding: 6px 20px 10px; border-top: 2px solid #1D9E75; text-align: center; font-size: 8.5px; color: #667; letter-spacing: .02em; background: #fff; }
      .rodape-sistema strong { color: #0F6E56; }
    </style>`;

    const corBadge = cls => cls==='verde'?'#22c55e':cls==='amarelo'?'#f59e0b':'#ef4444';

    const kpisHtml = `<div class="kpis">
      <div class="kpi-card"><div class="val">${brl(totalExecutadoMes)}</div><div class="lbl">EXECUTADO NO MÊS</div></div>
      <div class="kpi-card"><div class="val">${emDiaCount}/${contratos.length}</div><div class="lbl">CONTRATOS COM MEDIÇÃO EM DIA</div></div>
      <div class="kpi-card"><div class="val">${vencendo.length}</div><div class="lbl">CONTRATOS VENCENDO EM ATÉ 90 DIAS</div></div>
      <div class="kpi-card"><div class="val">${rubricasCriticas.length}</div><div class="lbl">RUBRICAS EM ALERTA (≥70% DO TETO)</div></div>
    </div>`;

    const tabelaStatusAtencao = statusAtencao.length ? `
      <table><thead><tr><th>Contrato</th><th>Empresa</th><th>Última medição</th><th>Status</th></tr></thead>
      <tbody>${statusAtencao.map(s => `<tr>
        <td class="num"><strong>${s.c.numero}</strong></td>
        <td class="desc">${s.c.empresa}</td>
        <td class="num">${s.ultimoMes?mesToPT(s.ultimoMes):'—'}</td>
        <td class="num"><span class="badge-pdf" style="background:${corBadge(s.cls)}">${s.label}</span></td>
      </tr>`).join('')}</tbody></table>
      <div class="obs">Os demais ${emDiaCount} contrato(s) estão com a medição em dia e não são listados aqui.</div>`
      : `<div class="obs">Todos os ${contratos.length} contrato(s) monitorados estão com a medição em dia neste mês.</div>`;

    const tabelaVencendo = vencendo.length ? `
      <table><thead><tr><th>Contrato</th><th>Empresa</th><th>Vencimento</th><th>Dias restantes</th></tr></thead>
      <tbody>${vencendo.map(c => `<tr>
        <td class="num"><strong>${c.numero}</strong></td>
        <td class="desc">${c.empresa}</td>
        <td class="num">${fmtD(c.fim)}</td>
        <td class="num" style="color:${dias(c.fim)<=30?'#b91c1c':'#000'}">${dias(c.fim)}</td>
      </tr>`).join('')}</tbody></table>` : '<div class="obs">Nenhum contrato vencendo nos próximos 90 dias.</div>';

    const graficoRubricas = rubricasRel.length ? `<div class="chart-box">
        <div class="titulo-chart">% do teto mensal consumido por rubrica${rubricasRel.length>12?' (12 mais críticas)':''}</div>
        ${svgBarrasHorizontaisPDF(rubricasRel.slice(0,12).map(r=>({label:`${r.rub} - ${r.desc}`, pct:r.pct})))}
      </div>` : '';
    const tabelaRubrica = rubricasCriticas.length ? `
      <table><thead><tr><th>Rubrica</th><th>Teto mensal aprovado</th><th>Executado no mês</th><th>% do teto</th></tr></thead>
      <tbody>${rubricasCriticas.map(r => `<tr>
        <td class="desc">${r.rub} - ${r.desc}</td>
        <td class="val">${brl(r.tetoMensal)}</td>
        <td class="val">${brl(r.executado)}</td>
        <td class="num" style="color:${r.pct>=100?'#b91c1c':'#000'}">${r.pct}%</td>
      </tr>`).join('')}</tbody></table>
      <div class="obs">As demais ${rubricasRel.length-rubricasCriticas.length} rubrica(s) com item cadastrado estão abaixo de 70% do teto mensal e não são listadas aqui.</div>`
      : '<div class="obs">Nenhuma rubrica atingiu 70% do teto mensal aprovado neste mês.</div>';

    const graficoEvolucao = `<div class="chart-box">
      <div class="titulo-chart">Evolução do valor executado — últimos 6 meses (todos os contratos)</div>
      ${svgLinhaEvolucaoPDF(evolucaoMensal)}
    </div>`;

    // Investimentos — consumo x saldo do teto anual, por ano (dá ciência do
    // saldo existente ao gestor, mesma visão da aba Investimentos do sistema).
    const anosInvestimentoRel = [...new Set([...tetosInvestimento.map(t=>t.ano), ...contratos.filter(c=>c.tipo==='Investimento'&&c.inicio).map(c=>new Date(c.inicio+'T00:00:00').getFullYear())])].sort((a,b)=>a-b);
    const dadosInvestimentoRel = anosInvestimentoRel.map(ano => {
      const tetoDoAno = tetosInvestimento.find(t=>t.ano===ano)?.valor ?? 0;
      const empenhadoDoAno = contratos.filter(c=>c.tipo==='Investimento' && c.inicio && new Date(c.inicio+'T00:00:00').getFullYear()===ano).reduce((acc,c)=>acc+(c.vlr_total||0),0);
      return { label:String(ano), consumido: empenhadoDoAno, saldo: Math.max(0, tetoDoAno-empenhadoDoAno), teto: tetoDoAno };
    });
    const graficoInvestimentos = dadosInvestimentoRel.length ? `<div class="chart-box">
      <div class="titulo-chart">Investimentos — consumo x saldo do teto anual, por ano</div>
      ${svgBarrasEmpilhadasPDF(dadosInvestimentoRel)}
    </div>
    <table><thead><tr><th>Ano</th><th>Teto anual</th><th>Empenhado</th><th>Saldo disponível</th></tr></thead>
    <tbody>${dadosInvestimentoRel.map(d => `<tr>
      <td class="num"><strong>${d.label}</strong></td>
      <td class="val">${brl(d.teto)}</td>
      <td class="val">${brl(d.consumido)}</td>
      <td class="val" style="color:${d.saldo<=0?'#b91c1c':'#166534'};font-weight:bold">${brl(d.saldo)}</td>
    </tr>`).join('')}</tbody></table>`
      : '<div class="obs">Nenhum teto de investimento cadastrado ainda.</div>';

    const tabelaAditivoSupressao = analiseReequilibrioRel.length ? `
      <table><thead><tr><th>Contrato</th><th>Empresa</th><th>Situação</th><th>Valor</th></tr></thead>
      <tbody>${analiseReequilibrioRel.map(a => `<tr>
        <td class="num"><strong>${a.contrato.numero}</strong></td>
        <td class="desc">${a.contrato.empresa}</td>
        <td class="num"><span class="badge-pdf" style="background:${a.podeReequilibrar?'#22c55e':'#ef4444'}">${a.podeReequilibrar?'Reequilíbrio interno resolve':'Precisa de aditivo'}</span></td>
        <td class="val">${a.podeReequilibrar?brl(a.totalFalta):brl(a.valorAditivoNecessario)}</td>
      </tr>`).join('')}</tbody></table>
      <div class="obs">Indicativo pra apoiar a decisão — o detalhe item a item de cada contrato está na aba Aditivos e Supressões do sistema.</div>`
      : '<div class="obs">Nenhum contrato com necessidade real de aditivo ou supressão identificada neste mês.</div>';

    const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório Mensal - ${mesRef}</title>${estilos}</head><body>
      <div class="header">${logoImg}<h3>PROJETO SOCIAL CRESCE COMUNIDADE — PRIMA QUALITÁ SAÚDE</h3></div>
      <div class="titulo-box"><h2>RELATÓRIO MENSAL DE ACOMPANHAMENTO DE CONTRATOS</h2><div style="font-size:11px;margin-top:4px">${UNIDADE_CONFIG.nomeUnidade} · Contrato de Gestão nº ${UNIDADE_CONFIG.contratoGestao} · Referência: ${mesRef}</div></div>

      <div class="sec-titulo">RESUMO EXECUTIVO</div>
      <div class="resumo-texto">${paragrafo1}</div>
      <div class="resumo-texto">${paragrafo2}</div>
      <div class="resumo-texto">${paragrafo3}</div>
      ${kpisHtml}
      ${graficoEvolucao}

      <div class="sec-titulo">1. MEDIÇÕES QUE PRECISAM DE ATENÇÃO</div>
      ${tabelaStatusAtencao}

      <div class="sec-titulo">2. CONTRATOS PRÓXIMOS DO VENCIMENTO (≤ 90 DIAS)</div>
      ${tabelaVencendo}

      <div class="sec-titulo">3. CONSUMO POR RUBRICA ORÇAMENTÁRIA</div>
      ${graficoRubricas}
      ${tabelaRubrica}

      <div class="sec-titulo">4. ADITIVO / SUPRESSÃO — INDICATIVO PARA DECISÃO</div>
      ${tabelaAditivoSupressao}

      <div class="sec-titulo">5. INVESTIMENTOS — TETO E SALDO</div>
      ${graficoInvestimentos}

      <div class="sec-titulo">CONSIDERAÇÕES E RECOMENDAÇÕES</div>
      <ul class="recos">${recomendacoes.map(r=>`<li>${r}</li>`).join('')}</ul>

      <div class="assinaturas" style="justify-content:center">
        <div class="assinatura-box"><div class="linha"></div><p style="font-size:10px">Mírian Vicente Dias<br/>Diretora Administrativa</p></div>
      </div>
      <div class="rodape-sistema">
        Documento gerado automaticamente pelo <strong>SisContratos HMC</strong> · ${UNIDADE_CONFIG.nomeUnidade} · Contrato de Gestão nº ${UNIDADE_CONFIG.contratoGestao}<br/>
        Gerado em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
      </div>
    </body></html>`;

    const janela = window.open('', '_blank');
    janela.document.write(html);
    janela.document.close();
    janela.print();
  };

  // ─── INVESTIMENTOS (teto anual compartilhado entre vários contratos) ──────
  const salvarTetoInvestimento = async (ano, valor) => {
    const { error } = await sb().from('tetos_investimento').upsert({ ano, valor, updated_at: new Date().toISOString() });
    if (error) { alert('Erro ao salvar teto: ' + error.message + ' — confirma que a tabela tetos_investimento existe (SQL enviado no chat).'); return; }
    await loadAll();
  };

  const salvarRepasse = async (contratoId, data, valor) => {
    if (!data || !valor) { alert('Preencha data e valor.'); return; }
    const { error } = await sb().from('investimento_repasses').insert({
      id: uid('R'), contrato_id: contratoId, data, valor: parseFloat(valor)
    });
    if (error) { alert('Erro ao lançar repasse: ' + error.message + ' — confirma que a tabela investimento_repasses existe (SQL enviado no chat).'); return; }
    await loadAll();
  };

  const excluirRepasse = async (id) => {
    if (!confirm('Excluir este repasse?')) return;
    await sb().from('investimento_repasses').delete().eq('id', id);
    await loadAll();
  };

  const salvarPagamento = async (contratoId, data, valor) => {
    if (!data || !valor) { alert('Preencha data e valor.'); return; }
    const { error } = await sb().from('investimento_pagamentos').insert({
      id: uid('P'), contrato_id: contratoId, data, valor: parseFloat(valor)
    });
    if (error) { alert('Erro ao lançar pagamento: ' + error.message + ' — confirma que a tabela investimento_pagamentos existe (SQL enviado no chat).'); return; }
    await loadAll();
  };

  const excluirPagamento = async (id) => {
    if (!confirm('Excluir este pagamento?')) return;
    await sb().from('investimento_pagamentos').delete().eq('id', id);
    await loadAll();
  };

  const renderInvestimentos = () => {
    const contratosInvestimento = contratos.filter(c => c.tipo === 'Investimento' && c.inicio && new Date(c.inicio+'T00:00:00').getFullYear() === anoInvestimento);
    const tetoAtual = tetosInvestimento.find(t => t.ano === anoInvestimento)?.valor ?? 0;
    const totalEmpenhado = contratosInvestimento.reduce((acc,c) => acc + (c.vlr_total||0), 0);
    // Saldo acumulado: soma de todos os tetos e de todo o empenhado desde o
    // primeiro ano com dado até o ano selecionado — sobra de um ano continua
    // disponível no seguinte, não reseta a cada 1º de janeiro.
    const tetoAcumulado = tetosInvestimento.filter(t => t.ano <= anoInvestimento).reduce((acc,t)=>acc+(t.valor||0), 0);
    const empenhadoAcumulado = contratos.filter(c => c.tipo === 'Investimento' && c.inicio && new Date(c.inicio+'T00:00:00').getFullYear() <= anoInvestimento).reduce((acc,c)=>acc+(c.vlr_total||0), 0);
    const saldoTeto = tetoAcumulado - empenhadoAcumulado;
    const pctUsado = tetoAcumulado>0 ? Math.min(Math.round((empenhadoAcumulado/tetoAcumulado)*100),100) : 0;
    const anosDisponiveis = [...new Set([anoInvestimento, ...tetosInvestimento.map(t=>t.ano), ...contratos.filter(c=>c.tipo==='Investimento'&&c.inicio).map(c=>new Date(c.inicio+'T00:00:00').getFullYear())])].sort((a,b)=>b-a);

    // Gráfico consumo x saldo: um ponto por ano (não acumulado — cada ano
    // isolado), mostrando teto do ano, quanto foi empenhado nele, e o saldo
    // que sobrou. Fácil de ver de cara quanto foi usado a cada ano.
    const anosGrafico = anosDisponiveis.slice().sort((a,b)=>a-b);
    const dadosGrafico = anosGrafico.map(ano => {
      const tetoDoAno = tetosInvestimento.find(t=>t.ano===ano)?.valor ?? 0;
      const empenhadoDoAno = contratos.filter(c=>c.tipo==='Investimento' && c.inicio && new Date(c.inicio+'T00:00:00').getFullYear()===ano).reduce((acc,c)=>acc+(c.vlr_total||0),0);
      return { ano, consumido: empenhadoDoAno, saldo: Math.max(0, tetoDoAno-empenhadoDoAno) };
    });

    const repassesPorContrato = cid => repassesInvestimento.filter(r => r.contrato_id === cid).sort((a,b)=>a.data.localeCompare(b.data));
    const pagamentosPorContrato = cid => pagamentosInvestimento.filter(p => p.contrato_id === cid).sort((a,b)=>a.data.localeCompare(b.data));
    const totalRecebidoGeral = contratosInvestimento.reduce((acc,c) => acc + repassesPorContrato(c.id).reduce((a,r)=>a+(r.valor||0),0), 0);
    const totalPagoGeral = contratosInvestimento.reduce((acc,c) => acc + pagamentosPorContrato(c.id).reduce((a,p)=>a+(p.valor||0),0), 0);
    const saldoCaixaGeral = totalRecebidoGeral - totalPagoGeral;

    // Acumulado de entrada por ano — visão histórica, independente do ano
    // selecionado no filtro acima (mostra todos os anos com repasse lançado).
    const anosComRepasse = [...new Set(repassesInvestimento.map(r => r.data.slice(0,4)))].sort();
    let corrido = 0;
    const acumuladoPorAno = anosComRepasse.map(ano => {
      const totalAno = repassesInvestimento.filter(r => r.data.slice(0,4) === ano).reduce((a,r)=>a+(r.valor||0),0);
      corrido += totalAno;
      return { ano, totalAno, acumulado: corrido };
    });

    return (
      <div className="panel">
        <div className="panel-head">
          <h2><i className="fa-solid fa-piggy-bank"/> Investimentos — teto anual (Contrato de Gestão, reajuste INPC)</h2>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <select value={anoInvestimento} onChange={e=>setAnoInvestimento(parseInt(e.target.value))} style={{padding:'6px 10px'}}>
              {anosDisponiveis.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
            <button className="btn btn-primary btn-sm" onClick={() => openModal('novo')}><i className="fa-solid fa-plus"/> Novo contrato de investimento</button>
          </div>
        </div>
        <div className="panel-body">
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,fontWeight:600}}>Teto anual de {anoInvestimento} (ajustado pelo INPC no Contrato de Gestão)</label>
            <div style={{display:'flex',gap:8,marginTop:4,maxWidth:280}}>
              <input type="number" step="0.01" defaultValue={tetoAtual} id="input-teto-investimento" style={{flex:1}} />
              <button className="btn btn-secondary btn-sm" onClick={() => {
                const v = parseFloat(document.getElementById('input-teto-investimento').value) || 0;
                salvarTetoInvestimento(anoInvestimento, v);
              }}>Salvar</button>
            </div>
          </div>

          <div className="s-label" style={{marginBottom:6}}>Teto acumulado x contratado (soma de todos os anos até {anoInvestimento})</div>
          <div className="kpis-row" style={{display:'flex',gap:12,marginBottom:10,flexWrap:'wrap'}}>
            <div className="panel" style={{margin:0,flex:1,minWidth:160}}><div className="panel-body" style={{textAlign:'center',padding:14}}>
              <div style={{fontSize:20,fontWeight:700,color:'var(--teal-d)'}}>{brl(empenhadoAcumulado)}</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>EMPENHADO ACUMULADO ATÉ {anoInvestimento}</div>
            </div></div>
            <div className="panel" style={{margin:0,flex:1,minWidth:160}}><div className="panel-body" style={{textAlign:'center',padding:14}}>
              <div style={{fontSize:20,fontWeight:700}}>{brl(tetoAcumulado)}</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>TETO ACUMULADO ATÉ {anoInvestimento}</div>
            </div></div>
            <div className="panel" style={{margin:0,flex:1,minWidth:160}}><div className="panel-body" style={{textAlign:'center',padding:14}}>
              <div style={{fontSize:20,fontWeight:700,color:saldoTeto<0?'#b91c1c':'#16a34a'}}>{brl(saldoTeto)}</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>{saldoTeto<0?'ESTOURADO EM':'SALDO ACUMULADO (P/ NOVOS CONTRATOS)'}</div>
            </div></div>
          </div>
          <div style={{marginBottom:16}}>
            <ProgBar p={pctUsado} />
            <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>{pctUsado}% do teto acumulado já empenhado até {anoInvestimento} · empenhado só em {anoInvestimento}: {brl(totalEmpenhado)} de {brl(tetoAtual)} de teto daquele ano</div>
          </div>

          {dadosGrafico.length>0 && (
            <div style={{marginBottom:20}}>
              <div className="s-label" style={{marginBottom:6}}>Consumo x saldo, por ano</div>
              <ConsumoSaldoChart labels={dadosGrafico.map(d=>String(d.ano))} consumido={dadosGrafico.map(d=>d.consumido)} saldo={dadosGrafico.map(d=>d.saldo)} />
            </div>
          )}

          <div className="s-label" style={{marginBottom:6}}>Movimento de caixa — entrada (repasse do município) x saída (pagamento ao fornecedor)</div>
          <div className="kpis-row" style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap'}}>
            <div className="panel" style={{margin:0,flex:1,minWidth:160}}><div className="panel-body" style={{textAlign:'center',padding:14}}>
              <div style={{fontSize:20,fontWeight:700,color:'#16a34a'}}>{brl(totalRecebidoGeral)}</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>↓ ENTRADA — RECEBIDO DO MUNICÍPIO</div>
            </div></div>
            <div className="panel" style={{margin:0,flex:1,minWidth:160}}><div className="panel-body" style={{textAlign:'center',padding:14}}>
              <div style={{fontSize:20,fontWeight:700,color:'#b45309'}}>{brl(totalPagoGeral)}</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>↑ SAÍDA — PAGO AO FORNECEDOR</div>
            </div></div>
            <div className="panel" style={{margin:0,flex:1,minWidth:160}}><div className="panel-body" style={{textAlign:'center',padding:14}}>
              <div style={{fontSize:20,fontWeight:700,color:saldoCaixaGeral<0?'#b91c1c':'var(--teal-d)'}}>{brl(saldoCaixaGeral)}</div>
              <div style={{fontSize:11,color:'var(--text3)'}}>SALDO EM CAIXA (ENTRADA − SAÍDA)</div>
            </div></div>
          </div>

          {acumuladoPorAno.length>0 && (
            <div style={{marginBottom:20}}>
              <div className="s-label" style={{marginBottom:6}}>Acumulado de entrada por ano (todas as entradas já lançadas, qualquer ano)</div>
              <div className="tbl-wrap">
                <table>
                  <thead><tr><th>Ano</th><th>Total recebido</th><th>Acumulado</th></tr></thead>
                  <tbody>{acumuladoPorAno.map(a => (
                    <tr key={a.ano}>
                      <td className="mono"><strong>{a.ano}</strong></td>
                      <td style={{fontWeight:600,color:'#16a34a'}}>{brl(a.totalAno)}</td>
                      <td style={{fontWeight:600}}>{brl(a.acumulado)}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
            </div>
          )}

          <div className="tbl-wrap">
            <table>
              <thead><tr><th>Contrato</th><th>Empresa</th><th>Empenhado</th><th>Entrada</th><th>Saída</th><th>Saldo em caixa</th><th></th></tr></thead>
              <tbody>{contratosInvestimento.length ? contratosInvestimento.map(c => {
                const reps = repassesPorContrato(c.id);
                const pags = pagamentosPorContrato(c.id);
                const recebido = reps.reduce((a,r)=>a+(r.valor||0),0);
                const pago = pags.reduce((a,p)=>a+(p.valor||0),0);
                const saldoCaixaContrato = recebido - pago;
                const aberto = contratoRepasseAberto === c.id;
                return (
                  <React.Fragment key={c.id}>
                    <tr>
                      <td className="mono"><strong>{c.numero}</strong></td>
                      <td>{c.empresa}</td>
                      <td style={{fontWeight:600}}>{brl(c.vlr_total)}</td>
                      <td style={{fontWeight:600,color:'#16a34a'}}>{brl(recebido)}</td>
                      <td style={{fontWeight:600,color:'#b45309'}}>{brl(pago)}</td>
                      <td style={{fontWeight:600,color:saldoCaixaContrato<0?'#b91c1c':'var(--teal-d)'}}>{brl(saldoCaixaContrato)}</td>
                      <td><ActBtn icon={aberto?'fa-chevron-up':'fa-chevron-down'} onClick={()=>setContratoRepasseAberto(aberto?null:c.id)} title="Ver/lançar entrada e saída" /></td>
                    </tr>
                    {aberto && (
                      <tr><td colSpan={7} style={{padding:0,background:'#FAFBFD'}}>
                        <div style={{padding:'12px 16px',display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:20}}>
                          <div>
                            <div style={{fontSize:11,fontWeight:700,color:'#166534',marginBottom:6}}>↓ ENTRADA — Repasse do município</div>
                            {reps.length>0 && (
                              <table style={{marginBottom:10}}>
                                <thead><tr><th>Data</th><th>Valor</th><th></th></tr></thead>
                                <tbody>{reps.map(r => (
                                  <tr key={r.id}>
                                    <td className="num">{fmtD(r.data)}</td>
                                    <td className="val" style={{fontWeight:600}}>{brl(r.valor)}</td>
                                    <td><ActBtn icon="fa-trash" danger onClick={()=>excluirRepasse(r.id)} title="Excluir repasse" /></td>
                                  </tr>
                                ))}</tbody>
                              </table>
                            )}
                            <div style={{display:'flex',gap:8,alignItems:'end',flexWrap:'wrap'}}>
                              <div>
                                <label style={{fontSize:11,display:'block',marginBottom:3}}>Data</label>
                                <input type="date" id={`repasse-data-${c.id}`} />
                              </div>
                              <div>
                                <label style={{fontSize:11,display:'block',marginBottom:3}}>Valor recebido</label>
                                <input type="number" step="0.01" placeholder="0,00" id={`repasse-valor-${c.id}`} style={{width:120}} />
                              </div>
                              <button className="btn btn-primary btn-sm" onClick={() => {
                                const data = document.getElementById(`repasse-data-${c.id}`).value;
                                const valor = document.getElementById(`repasse-valor-${c.id}`).value;
                                salvarRepasse(c.id, data, valor);
                              }}><i className="fa-solid fa-plus"/> Lançar entrada</button>
                            </div>
                          </div>
                          <div>
                            <div style={{fontSize:11,fontWeight:700,color:'#92400e',marginBottom:6}}>↑ SAÍDA — Pagamento ao fornecedor</div>
                            {pags.length>0 && (
                              <table style={{marginBottom:10}}>
                                <thead><tr><th>Data</th><th>Valor</th><th></th></tr></thead>
                                <tbody>{pags.map(p => (
                                  <tr key={p.id}>
                                    <td className="num">{fmtD(p.data)}</td>
                                    <td className="val" style={{fontWeight:600}}>{brl(p.valor)}</td>
                                    <td><ActBtn icon="fa-trash" danger onClick={()=>excluirPagamento(p.id)} title="Excluir pagamento" /></td>
                                  </tr>
                                ))}</tbody>
                              </table>
                            )}
                            <div style={{display:'flex',gap:8,alignItems:'end',flexWrap:'wrap'}}>
                              <div>
                                <label style={{fontSize:11,display:'block',marginBottom:3}}>Data</label>
                                <input type="date" id={`pagamento-data-${c.id}`} />
                              </div>
                              <div>
                                <label style={{fontSize:11,display:'block',marginBottom:3}}>Valor pago</label>
                                <input type="number" step="0.01" placeholder="0,00" id={`pagamento-valor-${c.id}`} style={{width:120}} />
                              </div>
                              <button className="btn btn-secondary btn-sm" onClick={() => {
                                const data = document.getElementById(`pagamento-data-${c.id}`).value;
                                const valor = document.getElementById(`pagamento-valor-${c.id}`).value;
                                salvarPagamento(c.id, data, valor);
                              }}><i className="fa-solid fa-plus"/> Lançar saída</button>
                            </div>
                          </div>
                        </div>
                      </td></tr>
                    )}
                  </React.Fragment>
                );
              }) : (
                <tr><td colSpan={7} style={{textAlign:'center',padding:20,color:'var(--text3)'}}>Nenhum contrato de investimento cadastrado em {anoInvestimento} ainda.</td></tr>
              )}</tbody>
            </table>
          </div>
          <div style={{padding:'8px 4px',fontSize:11.5,color:'var(--text3)'}}>
            <i className="fa-solid fa-circle-info"/> Contratos de investimento são cadastrados como qualquer outro contrato (Contratos → Novo contrato → Tipo = Investimento). Entrada (repasse do município) e saída (pagamento ao fornecedor) são lançadas avulsas, cada uma com data e valor livres — não precisam ser mensais nem seguir ordem, já que os dois fluxos podem atrasar de forma independente. O teto anual muda conforme o reajuste do INPC no Contrato de Gestão — atualize aqui a cada novo ano.
          </div>
        </div>
      </div>
    );
  };

  const renderRelatorio = () => (
    <div className="panel">

  // ─── PEDIDO DE COMPRA ────────────────────────────────────────────────────
  const gerarPedidoCompra = () => {
    const c = contratos.find(x => x.id === pedidoContrato);
    if (!c) { alert('Selecione um contrato.'); return; }
    const itensDoContrato = itens.filter(i => i.contrato_id === pedidoContrato).slice().sort((a,b)=>(a.ordem||999)-(b.ordem||999));
    const hoje = new Date();

    let totalGeral = 0;
    const linhas = itensDoContrato.map(it => {
      const qtd = parseFloat(pedidoQtds[it.id] || 0);
      const total = qtd * (it.vlr_unitario || 0);
      totalGeral += total;
      return `<tr>
        <td class="num">${it.ordem||''}</td>
        <td class="desc">${it.item}</td>
        <td class="num">${it.unit||'un.'}</td>
        <td class="num" style="font-weight:bold">${qtd}</td>
        <td class="val">R$ ${(it.vlr_unitario||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td>

      </tr>`;

    const logoImg = LOGO_PDF_B64 ? `<img src="data:image/png;base64,${LOGO_PDF_B64}" style="width:100%;max-width:100%;display:block;">` : '<strong>PRIMA QUALITÁ SAÚDE</strong>';
    const estilos = `<style>
      * { box-sizing: border-box; margin:0; padding:0; }
      body { font-family: Arial, sans-serif; font-size: 11px; color:#000; padding:24px; }
      .header { text-align:center; margin-bottom:14px; }
      .header img { width:100%; height:auto; margin-bottom:8px; }
      .titulo-box { border:1px solid #000; padding:10px; text-align:center; margin-bottom:16px; }
      .titulo-box h2 { font-size:15px; font-weight:bold; }
      .info { margin-bottom:14px; line-height:1.8; font-size:11px; }
      table { width:100%; border-collapse:collapse; margin-bottom:8px; }
      th { background:#d0d0d0; border:1px solid #000; padding:5px 6px; font-size:10px; text-align:center; font-weight:bold; }
      td { border:1px solid #000; padding:4px 6px; font-size:10px; }
      td.desc{text-align:left;} td.num{text-align:center;} td.val{text-align:right;}

      @media print { body{padding:12px;} }
    </style>`;

    const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Pedido de Compra - ${c.numero}</title>${estilos}</head><body>
      <div class="header">${logoImg}</div>
      <div class="titulo-box"><h2>PEDIDO DE COMPRA / SOLICITAÇÃO DE FORNECIMENTO</h2></div>
      <div class="info">
        <strong>Contrato:</strong> ${c.numero} &nbsp;&nbsp; <strong>Data do pedido:</strong> ${hoje.toLocaleDateString('pt-BR')}<br/>
        <strong>Fornecedor:</strong> ${c.empresa}<br/>
        <strong>CNPJ:</strong> ${c.cnpj || '___.___.___/____-__'}<br/>
        <strong>Representante Legal:</strong> ${c.representante || '___________________'}
      </div>
      <table><thead><tr><th>Item</th><th>Descrição</th><th>Unid.</th><th>Qtd. solicitada</th><th>Valor unitário</th><th>Valor total</th></tr></thead>
      <tbody>${linhas}</tbody></table>
      <div class="total-geral">TOTAL ESTIMADO DO PEDIDO &nbsp;&nbsp; R$ ${totalGeral.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
      <br/><br/>
      <div style="display:flex;gap:60px;justify-content:center;margin-top:40px">
        <div style="text-align:center;font-size:10px"><div style="border-top:1px solid #000;width:220px;margin-bottom:4px"></div>Solicitante</div>
        <div style="text-align:center;font-size:10px"><div style="border-top:1px solid #000;width:220px;margin-bottom:4px"></div>Aprovação</div>
      </div>
      <div class="rodape-sistema">
        Documento gerado automaticamente pelo <strong>SisContratos HMC</strong> · ${UNIDADE_CONFIG.nomeUnidade} · Contrato de Gestão nº ${UNIDADE_CONFIG.contratoGestao}<br/>
        Gerado em ${hoje.toLocaleDateString('pt-BR')} às ${hoje.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
      </div>
    </body></html>`;

    const janela = window.open('', '_blank');
    janela.document.write(html);
    janela.document.close();
    janela.print();
  };

  const renderPedido = () => {
    const c = contratos.find(x => x.id === pedidoContrato);
    const itensDoContrato = pedidoContrato ? itens.filter(i => i.contrato_id === pedidoContrato).slice().sort((a,b)=>(a.ordem||999)-(b.ordem||999)) : [];
    const totalPedido = itensDoContrato.reduce((acc,it) => acc + (parseFloat(pedidoQtds[it.id]||0) * (it.vlr_unitario||0)), 0);

    return (
      <>
        <div className="panel">

                  <option value="">— Selecione —</option>

                </select>
              </div>
              <div className="form-group">
                <label>Sugerir quantidade com base em</label>
                <select value={pedidoBase} onChange={e=>setPedidoBase(e.target.value)}>
                  <option value="media">Média histórica de consumo real</option>
                  <option value="contratado">Quantidade contratada/mês</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        {c && itensDoContrato.length > 0 && (
          <div className="panel">
            <div className="panel-head">
              <h2><i className="fa-solid fa-list-check"/> Itens — {c.numero}</h2>
              <button className="btn btn-primary" onClick={gerarPedidoCompra}><i className="fa-solid fa-file-pdf"/> Gerar pedido de compra</button>
            </div>
            <div className="panel-body">
              <div className="tbl-wrap">
                <table>
                  <thead><tr><th>Item</th><th>Unidade</th><th>Qtd contratada/mês</th><th>Qtd sugerida</th><th>Valor unitário</th><th>Total estimado</th></tr></thead>
                  <tbody>{itensDoContrato.map(it => {
                    const qtd = parseFloat(pedidoQtds[it.id]||0);
                    const total = qtd * (it.vlr_unitario||0);
                    return (
                      <tr key={it.id}>
                        <td style={{maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.item}</td>
                        <td className="cell-m" style={{textAlign:'center'}}>{it.unit||'un.'}</td>
                        <td className="cell-m" style={{textAlign:'center'}}>{it.qtd_mensal||0}</td>
                        <td style={{width:90}}>
                          <input type="number" min="0" value={pedidoQtds[it.id]||''}
                            onChange={e=>setPedidoQtds(prev=>({...prev,[it.id]:e.target.value}))}
                            style={{width:'100%',padding:'4px 6px',border:'1px solid var(--gray-b)',borderRadius:4,fontSize:12,textAlign:'center',fontWeight:600}} />
                        </td>
                        <td className="cell-m" style={{textAlign:'center'}}>{brl(it.vlr_unitario||0)}</td>
                        <td style={{fontWeight:700,color:'var(--teal-d)'}}>{brl(total)}</td>
                      </tr>
                    );

                </table>
              </div>
              <div style={{marginTop:14,padding:'10px 14px',background:'var(--teal-l)',borderRadius:6,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontSize:12,color:'var(--teal-d)',fontWeight:500}}>💰 Total estimado do pedido</div>
                <div style={{fontSize:20,fontWeight:700,color:'var(--teal-d)'}}>{brl(totalPedido)}</div>
              </div>
            </div>
          </div>

        {c && itensDoContrato.length === 0 && (
          <div className="panel"><div className="panel-body">
            <div className="empty"><i className="fa-solid fa-boxes-stacked"/>Este contrato não tem itens cadastrados.</div>
          </div></div>
        )}

        {!c && (
          <div className="panel"><div className="panel-body">
            <div className="empty"><i className="fa-solid fa-cart-shopping" style={{color:'var(--teal)'}}/>Selecione um contrato acima para montar o pedido de compra.</div>
          </div></div>

      </>
    );

  // ─── ANÁLISE PREDITIVA ──────────────────────────────────────────────────
  const renderPreditiva = () => {
    const hoje = new Date();
    const analise = [];
    contratos.forEach(c => {
      if(!c.inicio||!c.fim) return;
      const fimC = new Date(c.fim);
      const inicioC = new Date(c.inicio);
      const mesesTot = c.vigencia_meses || mesesCalendario(c.inicio, c.fim);
      const mesesDec = Math.max(1, Math.min(mesesTot, mesesCalendario(c.inicio, hoje.toISOString())));
      const mesesRest = Math.max(0, mesesTot - mesesDec);
      itens.filter(i=>i.contrato_id===c.id).forEach(it=>{
        const media = it.qtd_acum/mesesDec;
        const proj = Math.round(media*mesesRest);
        const qtdTot = it.qtd_total_contratada || (it.qtd_mensal*mesesTot);
        const saldo = Math.round(qtdTot-it.qtd_acum);
        const dif = Math.round(saldo-proj);
        const pct = qtdTot>0?Math.min(Math.round((it.qtd_acum/qtdTot)*100),100):0;
        const mensalReal = it.qtd_total_contratada ? (it.qtd_total_contratada/mesesTot) : it.qtd_mensal;
        const acao = dif<-1?'ADITIVO':dif>mensalReal*2?'SUPRESSÃO':'OK';
        analise.push({contrato:c.numero,item:it.item,qtdMensal:it.qtd_mensal,
          qtdAcum:it.qtd_acum,qtdTot:Math.round(qtdTot),saldo,
          media:media.toFixed(1),mesesRest,proj,dif,acao,pct});
      });
    });
    const aditivo = analise.filter(a=>a.acao==='ADITIVO').sort((a,b)=>a.dif-b.dif);
    const supressao = analise.filter(a=>a.acao==='SUPRESSÃO').sort((a,b)=>b.dif-a.dif);
    const ok = analise.filter(a=>a.acao==='OK');
    const Head = () => <thead><tr><th>Contrato</th><th>Item</th><th>Qtd/mês</th><th>Acumulado</th><th>Saldo atual</th><th>Média/mês</th><th>Meses rest.</th><th>Projeção</th><th>Diferença</th><th>% consumido</th><th>Ação</th></tr></thead>;
    const Row = ({a}) => <tr>
      <td className="mono"><strong>{a.contrato}</strong></td>
      <td style={{maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:11.5}}>{a.item}</td>
      <td style={{textAlign:'center'}}>{a.qtdMensal}</td>
      <td style={{textAlign:'center'}}>{a.qtdAcum}</td>
      <td style={{textAlign:'center',fontWeight:600,color:a.saldo<0?'#b91c1c':'var(--text)'}}>{a.saldo}</td>
      <td style={{textAlign:'center'}}>{a.media}</td>
      <td style={{textAlign:'center'}}>{a.mesesRest}</td>
      <td style={{textAlign:'center',fontWeight:600}}>{a.proj}</td>
      <td style={{textAlign:'center',fontWeight:700,color:a.acao==='ADITIVO'?'#b91c1c':a.acao==='SUPRESSÃO'?'#92400e':'#16a34a'}}>{a.dif>0?'+':''}{a.dif}</td>
      <td style={{minWidth:90}}><ProgBar p={a.pct}/></td>
      <td>{a.acao==='ADITIVO'&&<span className="badge vermelho">⚠ Aditivo</span>}{a.acao==='SUPRESSÃO'&&<span className="badge amarelo">↓ Supressão</span>}{a.acao==='OK'&&<span className="badge verde">✓ OK</span>}</td>
    </tr>;
    return <>
      <div className="cards-grid">
        <div className={`stat-card ${aditivo.length>0?'vermelho':'verde'}`}><div className="s-val">{aditivo.length}</div><div className="s-label">Precisam de aditivo</div><div className="s-sub">vai faltar antes do fim</div></div>
        <div className={`stat-card ${supressao.length>0?'amarelo':'verde'}`}><div className="s-val">{supressao.length}</div><div className="s-label">Indicados para supressão</div><div className="s-sub">vai sobrar ao fim do contrato</div></div>
        <div className="stat-card verde"><div className="s-val">{ok.length}</div><div className="s-label">Itens equilibrados</div><div className="s-sub">consumo dentro do esperado</div></div>
        <div className="stat-card azul"><div className="s-val">{analise.length}</div><div className="s-label">Total analisado</div><div className="s-sub">em {contratos.length} contratos</div></div>
      </div>
      <div className="panel"><div className="panel-head"><h2><i className="fa-solid fa-circle-info"/>Como a análise funciona</h2></div>
        <div className="panel-body" style={{fontSize:12.5,color:'var(--text2)',lineHeight:1.8}}>
          <strong style={{color:'var(--text)'}}>Média real/mês</strong> = quantidade acumulada ÷ meses decorridos desde o início<br/>
          <strong style={{color:'var(--text)'}}>Projeção</strong> = média real × meses restantes até o fim do contrato<br/>
          <strong style={{color:'var(--text)'}}>Diferença</strong> = saldo atual − projeção de consumo<br/>
          <span style={{color:'#b91c1c',fontWeight:600}}>⚠ Aditivo</span>: diferença negativa — vai faltar antes do vencimento<br/>
          <span style={{color:'#92400e',fontWeight:600}}>↓ Supressão</span>: vai sobrar mais de 2 meses de consumo — pode suprimir e remanejar
        </div>
      </div>
      {aditivo.length>0&&<div className="panel"><div className="panel-head"><h2><i className="fa-solid fa-triangle-exclamation" style={{color:'#ef4444'}}/>Precisam de ADITIVO ({aditivo.length})</h2><button className="btn btn-danger btn-sm" onClick={()=>openModal('aditivo')}><i className="fa-solid fa-plus"/> Registrar aditivo</button></div><div className="tbl-wrap"><table><Head/><tbody>{aditivo.map((a,i)=><Row key={i} a={a}/>)}</tbody></table></div></div>}
      {supressao.length>0&&<div className="panel"><div className="panel-head"><h2><i className="fa-solid fa-arrow-down" style={{color:'#f59e0b'}}/>Indicados para SUPRESSÃO ({supressao.length})</h2><button className="btn btn-secondary btn-sm" onClick={()=>openModal('aditivo')}><i className="fa-solid fa-plus"/> Registrar supressão</button></div><div className="tbl-wrap"><table><Head/><tbody>{supressao.map((a,i)=><Row key={i} a={a}/>)}</tbody></table></div></div>}
      {ok.length>0&&<div className="panel"><div className="panel-head"><h2><i className="fa-solid fa-circle-check" style={{color:'#22c55e'}}/>Itens equilibrados ({ok.length})</h2></div><div className="tbl-wrap"><table><Head/><tbody>{ok.map((a,i)=><Row key={i} a={a}/>)}</tbody></table></div></div>}
    </>;
  };

  const navItems = [
    { sec:'impacto', icon:'fa-star', label:'Impacto do projeto', group:'main' },
    { sec:'painel', icon:'fa-gauge-high', label:'Painel executivo', group:'main' },
    { sec:'contratos', icon:'fa-file-contract', label:'Contratos', group:'main' },
    { sec:'financeiro', icon:'fa-circle-dollar-to-slot', label:'Controle financeiro', group:'controles' },
    { sec:'quantidade', icon:'fa-boxes-stacked', label:'Controle de quantidade', group:'controles' },
    { sec:'prazo', icon:'fa-calendar-days', label:'Controle de prazo', group:'controles' },
    { sec:'aditivos', icon:'fa-file-pen', label:'Aditivos e supressões', group:'gestao' },
    { sec:'medicao', icon:'fa-file-invoice-dollar', label:'Medições mensais', group:'gestao' },
    { sec:'historico', icon:'fa-clock-rotate-left', label:'Histórico de medições', group:'gestao' },
    { sec:'rubrica', icon:'fa-scale-balanced', label:'Consumo por rubrica', group:'gestao' },
    { sec:'investimentos', icon:'fa-piggy-bank', label:'Investimentos', group:'gestao' },
    { sec:'relatorio', icon:'fa-file-lines', label:'Relatório mensal', group:'gestao' },
    { sec:'pedido', icon:'fa-cart-shopping', label:'Pedido de compra', group:'gestao' },
  ];

  const sectionTitles = { impacto:'Impacto do Projeto', painel:'Painel Executivo', contratos:'Contratos', financeiro:'Controle Financeiro', quantidade:'Controle de Quantidade', prazo:'Controle de Prazo', preditiva:'Análise Preditiva', aditivos:'Aditivos e Supressões', medicao:'Medições Mensais', historico:'Histórico de Medições', rubrica:'Consumo por Rubrica', investimentos:'Investimentos', relatorio:'Relatório Mensal', pedido:'Pedido de Compra' };

  if (!configured) return (
    <div style={{minHeight:'100vh',background:'#EEF2F6'}}>
      <div style={{background:'var(--teal-d)',padding:'16px 20px',display:'flex',alignItems:'center',gap:10}}>
        <img src={`data:image/png;base64,${LOGO_B64}`} style={{width:100,filter:'brightness(0) invert(1)'}} alt="Logo" />
        <div style={{color:'rgba(255,255,255,.7)',fontSize:12}}>SisContratos HMC · {UNIDADE_CONFIG.nomeUnidade}</div>
      </div>
      <ConfigScreen onSave={handleConfig} />
    </div>
  );

  return (
    <>
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="sidebar-logo-card"><img src={`data:image/png;base64,${LOGO_B64}`} className="sidebar-logo" alt="Prima Qualitá Saúde" /></div>
          <div className="sidebar-sub"><strong>SisContratos HMC</strong>Fiscalização de Contratos</div>
        </div>
        <div className="nav-sec">Navegação</div>
        {navItems.filter(n=>n.group==='main').map(n => (
          <button key={n.sec} className={`nav-btn${section===n.sec?' active':''}`} onClick={() => setSection(n.sec)}>
            <i className={`fa-solid ${n.icon}`} /> {n.label}
          </button>
        ))}
        <div className="nav-sec">Controles</div>
        {navItems.filter(n=>n.group==='controles').map(n => (
          <button key={n.sec} className={`nav-btn${section===n.sec?' active':''}`} onClick={() => setSection(n.sec)}>
            <i className={`fa-solid ${n.icon}`} /> {n.label}
          </button>
        ))}
        <div className="nav-sec">Gestão</div>
        {navItems.filter(n=>n.group==='gestao').map(n => (
          <button key={n.sec} className={`nav-btn${section===n.sec?' active':''}`} onClick={() => setSection(n.sec)}>
            <i className={`fa-solid ${n.icon}`} /> {n.label}
          </button>
        ))}
        <div className="sidebar-foot">
          <div className="user-row">
            <div className="user-av">MD</div>
            <div>
              <div className="user-name">Mírian V. Dias</div>
              <div className="user-role">Diretora Administrativa · Fiscal</div>
            </div>
          </div>
        </div>
      </aside>

      <div className="main">
        <div className="topbar">
          <div><h1>{sectionTitles[section]}</h1><p>{UNIDADE_CONFIG.nomeUnidade} · Contrato de Gestão nº {UNIDADE_CONFIG.contratoGestao}</p></div>
          <div className="topbar-right">
            <div className={`sync-indicator ${syncStatus}`}>
              {syncStatus==='loading' && <i className="fa-solid fa-rotate spin" />}
              {syncStatus==='ok' && <i className="fa-solid fa-cloud" />}
              {syncStatus==='err' && <i className="fa-solid fa-cloud-xmark" />}
              {syncStatus==='loading'?'Sincronizando...':syncStatus==='ok'?'Sincronizado':'Erro de conexão'}
            </div>
            <button className="btn btn-secondary btn-sm" onClick={loadAll}><i className="fa-solid fa-rotate" /> Atualizar</button>
            <button className="btn btn-primary" onClick={() => openModal('novo')}><i className="fa-solid fa-plus" /> Novo contrato</button>
          </div>
        </div>

        <div className="content">
          {section === 'impacto' && renderImpacto()}
          {section === 'painel' && renderPainel()}
          {section === 'contratos' && renderContratos()}
          {section === 'financeiro' && (
            <>
              <select className="sel-contract" value={selFin} onChange={e => setSelFin(e.target.value)}>
                <option value="">— Selecione um contrato —</option>
                {contratos.map(c => <option key={c.id} value={c.id}>{c.numero} · {c.empresa.substring(0,34)}</option>)}
              </select>
              {selFin && renderFinanceiro()}

          {section === 'quantidade' && (
            <>
              <select className="sel-contract" value={selQtd} onChange={e => setSelQtd(e.target.value)}>
                <option value="">— Selecione um contrato —</option>
                {contratos.map(c => <option key={c.id} value={c.id}>{c.numero} · {c.empresa.substring(0,34)}</option>)}
              </select>
              {selQtd && renderQuantidade()}

          {section === 'prazo' && renderPrazo()}
          {section === 'preditiva' && renderPreditiva()}
          {section === 'aditivos' && renderAditivos()}
          {section === 'medicao' && renderMedicao()}
          {section === 'historico' && renderHistorico()}
          {section === 'rubrica' && renderRubrica()}
          {section === 'investimentos' && renderInvestimentos()}
          {section === 'relatorio' && renderRelatorio()}
          {section === 'pedido' && renderPedido()}
        </div>
      </div>

      {pendenteRegistro && (
        <div style={{position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',zIndex:2000,background:'#fff',borderRadius:10,boxShadow:'0 12px 40px rgba(0,0,0,.25)',border:'1px solid var(--gray-b)',padding:'14px 18px',display:'flex',alignItems:'center',gap:16,maxWidth:560}}>
          <i className="fa-solid fa-file-circle-check" style={{fontSize:22,color:'var(--teal)'}} />
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13}}>Medição gerada — {pendenteRegistro.numero} · {pendenteRegistro.mesLabel}</div>
            <div style={{fontSize:12,color:'var(--text2)'}}>Total: {brl(pendenteRegistro.totalGeral)} — deseja registrar e atualizar os saldos?</div>
          </div>
          <button className="btn btn-secondary btn-sm" onClick={()=>setPendenteRegistro(null)} disabled={saving}>Descartar</button>
          <button className="btn btn-primary btn-sm" onClick={pendenteRegistro.executar} disabled={saving}>
            {saving ? <><i className="fa-solid fa-rotate spin" /> Salvando...</> : <><i className="fa-solid fa-floppy-disk" /> Registrar</>}
          </button>
        </div>
      )}

      {modal && (
        <Modal
          title={modal.tipo==='editar'?`Editar — ${contratos.find(x=>x.id===modal.id)?.numero||''}`:modalConfig[modal.tipo]?.title}
          icon={modalConfig[modal.tipo]?.icon||'fa-file'}
          onClose={closeModal}
          footer={
            <>
              <button className="btn btn-secondary" onClick={closeModal}>Cancelar</button>
              {modalConfig[modal.tipo]?.onSave && (
                <button className="btn btn-primary" onClick={modalConfig[modal.tipo].onSave} disabled={saving}>
                  {saving ? <><i className="fa-solid fa-rotate spin" /> Salvando...</> : <><i className="fa-solid fa-floppy-disk" /> Salvar</>}
                </button>
              )}
            </>
          }
        >
          <div key={`${modal.tipo}_${modal.id||'novo'}`}>{renderModalContent()}</div>
        </Modal>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
